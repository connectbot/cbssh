name: SonarCloud
on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  sonar:
    uses: connectbot/actions/.github/workflows/sonar-analysis.yml@e6d13d33632c888bfaaeb213d955b2318929278d
    with:
      producer_workflow: .github/workflows/ci.yml
      artifact_prefix: sonar-inputs
      config_path: .github/sonar.json
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
