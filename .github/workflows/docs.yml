name: Publish versioned documentation

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry previously failed release documentation builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'connectbot/cbssh' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v') || contains(github.event.workflow_run.head_branch, '.'))))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source from main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          validate-wrappers: true
          dependency-graph: disabled

      - name: Reconcile and save documentation archive
        id: docs
        uses: connectbot/actions/docs@main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          retry-failed: ${{ inputs.retry_failed || false }}
          publish: 'true'
          require-ci: 'true'

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation-build-logs
          path: ${{ runner.temp }}/docs-logs
          if-no-files-found: ignore

      - name: Set up Pages
        if: steps.docs.outputs.ready == 'true'
        uses: actions/configure-pages@v6.0.0

      - name: Upload complete site
        if: steps.docs.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/docs-site

      - name: Deploy to GitHub Pages
        if: steps.docs.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Report incomplete documentation
        if: steps.docs.outputs.ready != 'true' || steps.docs.outputs.failures != '0'
        run: |
          echo 'Some documentation builds failed. Successful versions were saved; see the job summary and build logs.'
          exit 1
